events {}

# Define which servers to include in the load balancing scheme.
#https://www.digitalocean.com/community/tutorials/understanding-nginx-server-and-location-block-selection-algorithms-pt

http {
    
   upstream ping {
        server microservice-calc-ping-1:5000;
     }

    upstream calc{
        server microservice-calc-calc-1:5000;
    }

    upstream soma{
        server microservice-calc-soma-1:5000;
    }

    upstream sub{
        server microservice-calc-sub-1:5000;
    }

    upstream mult{
        server microservice-calc-mult1-1:8080 weight=3;
        server microservice-calc-mult2-1:8080 weight=1;
        server microservice-calc-mult3-1:8080 backup;
    }

# This server accepts all traffic to port 80 and passes it to the upstream.
     server {
         listen 80;
        
         server_name app.com;

         location /ping {
              proxy_pass http://ping;
         }

         location /calc {
              proxy_pass http://calc;
         }

         location /soma {
              proxy_pass http://soma;
         }

         location /sub {
              proxy_pass http://sub;
         }

         location /mult{
               proxy_pass http://mult;
         }
     }
}
